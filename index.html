    <script>
      // --vh : hauteur visible, utilisée par les galeries photos.
      // On ne réécrit plus la balise viewport à chaque « resize » : sur iPhone,
      // la barre d'adresse de Safari déclenche des resize pendant le défilement,
      // et réécrire la balise viewport à ce moment-là faisait « décrocher » la
      // barre d'infos fixée en bas, qui se retrouvait au milieu de l'écran.
      (function(){
        var raf = 0;
        function setVh(){
          raf = 0;
          document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
        }
        window.addEventListener('resize', function(){ if (!raf) raf = requestAnimationFrame(setVh); }, { passive: true });
        setVh();
      })();
    </script>
